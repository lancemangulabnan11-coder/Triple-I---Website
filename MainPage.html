<!DOCTYPE html>
<html>
<head>
    <!-- wadadada -->
    <title>Landing Page</title>
    <style>
        
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
        }

        /* Top bar */
        .navbar {
            background: black;
            color: white;
            padding: 15px;
        }

        /* Main content now full width */
        .main {
            width: 97.5%;
            padding: 20px;
        }

        h2 {
            color: red;
        }

        .intro {
            display: flex;
            gap: 20px;
        }

        .intro-text {
            width: 60%;
        }

        .intro-box {
            width: 40%;
            height: 150px;
            border: 2px solid red;
        }

        /* Boxes row */
        .row {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            overflow-x: auto;      /* Enables horizontal scroll when needed */
            white-space: nowrap;   /* Prevents items from wrapping to a new line */
            width: 100%;           /* Sets a boundary for the container */
        }

        .box {
            flex: 1;
            height: 120px;
            border: 2px solid black;
            transition-duration: 0.4s;
            flex: 0 0 auto;        /* Prevents items from shrinking or growing */
            width: 300px;          /* Width for each item */
        }
        
        

        /* Grid (e-waste) */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            
        }

        .grid-box {
            height: 80px;
            border: 2px solid black;
            transition-duration: 0.4s;
        }
        .Right{
            margin-left: 70%;
        }
        .grid-box:hover{
            transform: translateY(-10px);
        }
        .box:hover{
            transform: translateY(-10px);
        }

        /* animation */
        #box1, #box2, #box3{
            
            background-repeat: no-repeat;
            background-size: cover;
        }

        #box1{
            background-image: url(walrus.jpg);
        }
        #box2{
            background-image: url(walrus.jpg);
        }
        /* PERALTA */
    </style>
</head>
<body>
    <div class="navbar">
        <a href="MainPage.html">E-Waste Hub PH</a>
        <a href="Devices_Screens_and_Monitor.html" class="Right">Profile</a>
        <a href="" class="Right2">Setting</a>
    </div>

    <div class="main">

        <h2>Landing Page</h2>

        <div class="intro">
            <div class="intro-text">
                <p>
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                    This is your intro text for the website.
                </p>
                <p><b>Example:</b> Hand Held Devices, Desktops, Mechanical Devices</p>
            </div>

            <div class="intro-box"></div>
        </div>

        <!-- Boxes -->
        <div class="row">
            <a href="Devices_Screens_and_Monitor" class="box" id="box1"></a>
            <a href="" class="box" id="box2"></a>
            <a href="" class="box" id="box3"></a>
            <a href="Devices_Screens_and_Monitor" class="box" id="box4"></a>
            <a href="" class="box" id="box5"></a>
            <a href="" class="box" id="box6"></a>
        </div>

        <h3>E-waste devices</h3>

        <!-- Grid For e-waste devices-->
        <div class="grid">
            <div class="grid-box"></div>
            <div class="grid-box"></div>
            <div class="grid-box"></div>
            <div class="grid-box"></div>
            <div class="grid-box"></div>
            <div class="grid-box"></div>
        </div>

    </div>

</body>
</html>
